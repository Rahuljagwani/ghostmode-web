<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Notification system: high-level design</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Accept fast, deliver asynchronously, one queue per channel</text><rect x="50" y="380" width="230" height="130" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="165.0" y="428.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Services</text><text x="165.0" y="454.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">orders, chat,</text><text x="165.0" y="481.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">marketing</text><rect x="350" y="380" width="280" height="130" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="490.0" y="441.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0c4a6e" text-anchor="middle">Notification</text><text x="490.0" y="469.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0c4a6e" text-anchor="middle">API</text><rect x="350" y="180" width="280" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="490.0" y="236.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">Preferences</text><text x="490.0" y="261.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">opt-outs, quiet hrs</text><rect x="350" y="600" width="280" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="490.0" y="656.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">Dedup + limits</text><text x="490.0" y="681.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">idempotency key</text><rect x="720" y="380" width="230" height="130" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="835.0" y="427.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#4c1d95" text-anchor="middle">Queues</text><text x="835.0" y="455.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#4c1d95" text-anchor="middle">one per</text><text x="835.0" y="484.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#4c1d95" text-anchor="middle">channel</text><rect x="1030" y="380" width="230" height="130" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1145.0" y="427.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14532d" text-anchor="middle">Workers</text><text x="1145.0" y="455.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14532d" text-anchor="middle">retry with</text><text x="1145.0" y="484.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14532d" text-anchor="middle">backoff</text><rect x="1340" y="230" width="220" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1450.0" y="286.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">Push</text><text x="1450.0" y="313.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">APNs / FCM</text><line x1="1262" y1="445" x2="1336" y2="290" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1340" y="390" width="220" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1450.0" y="446.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">Email</text><text x="1450.0" y="473.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">provider</text><line x1="1262" y1="445" x2="1336" y2="450" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1340" y="550" width="220" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1450.0" y="606.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">SMS</text><text x="1450.0" y="633.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">provider</text><line x1="1262" y1="445" x2="1336" y2="610" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="282" y1="445" x2="346" y2="445" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="490" y1="378" x2="490" y2="304" stroke="#475569" stroke-width="3.5" marker-start="url(#head)" marker-end="url(#head)"/><line x1="490" y1="512" x2="490" y2="596" stroke="#475569" stroke-width="3.5" marker-start="url(#head)" marker-end="url(#head)"/><line x1="632" y1="445" x2="716" y2="445" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="952" y1="445" x2="1026" y2="445" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><text x="50" y="810" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Failed sends retry with backoff, then go to a dead-letter queue. Delivery status is stored for every message.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>