" stroke="#7c3aed" stroke-width="3"/><text x="1350.0" y="521.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#4c1d95" text-anchor="middle">Analytics group</text><text x="1350.0" y="546.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4c1d95" text-anchor="middle">offset P0 = 2 (behind)</text><line x1="1062" y1="330" x2="1176" y2="295" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1082.6" y="278.5" width="72.80000000000001" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1119.0" y="304.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">read</text><line x1="1062" y1="480" x2="1176" y2="525" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1082.6" y="468.5" width="72.80000000000001" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1119.0" y="494.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">read</text><text x="80" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Order is kept within a partition. Add partitions to scale consumers in a group.</text><text x="80" y="780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Replay = move the offset back. Retention is by time or size, not by acknowledgement.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>