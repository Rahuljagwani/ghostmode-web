<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">RabbitMQ and SQS: queues that hand out work</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">A message is gone once a consumer acknowledges (deletes) it</text><rect x="70" y="340" width="220" height="140" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="180.0" y="419.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">Producer</text><rect x="380" y="320" width="260" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="510.0" y="393.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#78350f" text-anchor="middle">Exchange</text><text x="510.0" y="419.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78350f" text-anchor="middle">routes by key</text><text x="510.0" y="446.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78350f" text-anchor="middle">(RabbitMQ only)</text><rect x="760" y="200" width="300" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="910.0" y="269.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d" text-anchor="middle">Queue: emails</text><rect x="760" y="500" width="300" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="910.0" y="569.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d" text-anchor="middle">Queue: invoices</text><rect x="1200" y="160" width="300" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="1350.0" y="219.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Worker A</text><rect x="1200" y="290" width="300" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="1350.0" y="349.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Worker B</text><rect x="1200" y="520" width="300" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="1350.0" y="579.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Worker C</text><line x1="290" y1="410" x2="376" y2="410" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="640" y1="380" x2="756" y2="270" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="644.8" y="297.0" width="106.4" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="698.0" y="323.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">email.*</text><line x1="640" y1="440" x2="756" y2="555" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="633.6" y="501.5" width="128.8" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="698.0" y="527.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">invoice.*</text><line x1="1062" y1="245" x2="1196" y2="215" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1075.8" y="196.0" width="106.4" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1129.0" y="222.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">deliver</text><line x1="1062" y1="275" x2="1196" y2="335" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="1062" y1="560" x2="1196" y2="570" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1047.8" y="531.0" width="162.4" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1129.0" y="557.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">ack = delete</text><text x="80" y="740" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">SQS has no exchange: producers send straight to a queue, and consumers poll and delete.</text><text x="80" y="780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Unacked messages come back after a timeout, so consumers must be idempotent.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>