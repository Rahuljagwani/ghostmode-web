<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">The tool-calling loop</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">The model only asks for a tool. Your code runs it, checks it, and returns the result</text><rect x="70" y="300" width="260" height="160" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="200.0" y="376.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">User</text><text x="200.0" y="403.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">&quot;Refund order 1182&quot;</text><rect x="450" y="280" width="340" height="200" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="620.0" y="362.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#4c1d95" text-anchor="middle">LLM</text><text x="620.0" y="390.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#4c1d95" text-anchor="middle">sees tool schemas:</text><text x="620.0" y="419.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#4c1d95" text-anchor="middle">get_order, refund_order</text><rect x="950" y="170" width="380" height="170" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1140.0" y="239.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">Tool call (JSON)</text><text x="1140.0" y="264.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">refund_order</text><text x="1140.0" y="288.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">{order_id: 1182}</text><rect x="950" y="500" width="380" height="170" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1140.0" y="569.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d" text-anchor="middle">Your app runs it</text><text x="1140.0" y="594.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#14532d" text-anchor="middle">validate args, check</text><text x="1140.0" y="618.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#14532d" text-anchor="middle">permissions, then call API</text><rect x="450" y="600" width="340" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="620.0" y="669.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">Answer to user</text><line x1="330" y1="380" x2="446" y2="380" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="792" y1="320" x2="946" y2="260" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="771.0" y="250.0" width="196.00000000000003" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="869.0" y="276.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">1. request tool</text><line x1="1140" y1="342" x2="1140" y2="496" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1165.0" y="399.0" width="140.0" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1235.0" y="425.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">2. execute</text><line x1="946" y1="590" x2="792" y2="450" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="844.6" y="520.0" width="128.8" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="909.0" y="546.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">3. result</text><line x1="620" y1="482" x2="620" y2="596" stroke="#475569" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#head)"/><rect x="641.2" y="519.0" width="117.60000000000001" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="700.0" y="545.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">4. reply</text><text x="80" y="790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Loop until the model answers instead of calling a tool. Cap the number of steps,</text><text x="80" y="826" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">and ask the user before any action that changes data or moves money.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>