<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Fine-tuning vs RAG: what each one changes</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">RAG changes what the model knows right now; fine-tuning changes how it behaves</text><rect x="90" y="210" width="640" height="420" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="410.0" y="312.90000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#0c4a6e" text-anchor="middle">RAG</text><text x="410.0" y="347.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#0c4a6e" text-anchor="middle">fetches documents at question time</text><text x="410.0" y="381.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#0c4a6e" text-anchor="middle"></text><text x="410.0" y="415.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#0c4a6e" text-anchor="middle">+ fresh, private, changing data</text><text x="410.0" y="449.70000000000005" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#0c4a6e" text-anchor="middle">+ can cite sources</text><text x="410.0" y="483.90000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#0c4a6e" text-anchor="middle">+ update by re-indexing, no training</text><text x="410.0" y="518.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#0c4a6e" text-anchor="middle">- adds retrieval latency</text><text x="410.0" y="552.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#0c4a6e" text-anchor="middle">- only as good as the search</text><rect x="870" y="210" width="640" height="420" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1190.0" y="312.90000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#4c1d95" text-anchor="middle">Fine-tuning</text><text x="1190.0" y="347.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#4c1d95" text-anchor="middle">trains on examples of the task</text><text x="1190.0" y="381.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#4c1d95" text-anchor="middle"></text><text x="1190.0" y="415.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#4c1d95" text-anchor="middle">+ format, tone, style, labels</text><text x="1190.0" y="449.70000000000005" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#4c1d95" text-anchor="middle">+ shorter prompts, smaller models</text><text x="1190.0" y="483.90000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#4c1d95" text-anchor="middle">+ narrow, repeated tasks</text><text x="1190.0" y="518.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#4c1d95" text-anchor="middle">- needs good training data</text><text x="1190.0" y="552.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#4c1d95" text-anchor="middle">- knowledge goes stale</text><text x="90" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Common answer: start with prompting, add RAG for knowledge, fine-tune for behaviour. Many systems use both.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>