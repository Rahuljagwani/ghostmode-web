<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Anatomy of a production prompt</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Stable parts first (cacheable), the changing input last</text><rect x="80" y="190" width="1440" height="88" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="110" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="start">Role and task</text><text x="440" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#0c4a6e" text-anchor="start">You are a support assistant for an online bank...</text><rect x="80" y="294" width="1440" height="88" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="110" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#4c1d95" text-anchor="start">Rules</text><text x="440" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#4c1d95" text-anchor="start">Answer only from the context. If unsure, say so...</text><rect x="80" y="398" width="1440" height="88" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="110" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#14532d" text-anchor="start">Examples</text><text x="440" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14532d" text-anchor="start">2 or 3 short input -&gt; output pairs</text><rect x="80" y="502" width="1440" height="88" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="110" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#78350f" text-anchor="start">Context</text><text x="440" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#78350f" text-anchor="start">retrieved documents, user profile</text><rect x="80" y="606" width="1440" height="88" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="110" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start">Input</text><text x="440" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">the user&#x27;s question</text><rect x="80" y="710" width="1440" height="88" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="110" y="764" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#7f1d1d" text-anchor="start">Output format</text><text x="440" y="764" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#7f1d1d" text-anchor="start">JSON schema or exact headings</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>