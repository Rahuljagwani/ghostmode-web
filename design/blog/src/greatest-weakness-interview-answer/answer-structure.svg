<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">A 3-part answer to &quot;What is your greatest weakness?&quot;</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">About 45 to 60 seconds, real, and pointing at progress</text><rect x="90" y="260" width="400" height="220" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="290.0" y="349.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#7f1d1d" text-anchor="middle">1. The weakness</text><text x="290.0" y="381.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#7f1d1d" text-anchor="middle">real, specific,</text><text x="290.0" y="414.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#7f1d1d" text-anchor="middle">not core to the job</text><line x1="492" y1="370" x2="606" y2="370" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="610" y="260" width="400" height="220" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="810.0" y="349.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#78350f" text-anchor="middle">2. The proof</text><text x="810.0" y="381.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#78350f" text-anchor="middle">one moment it</text><text x="810.0" y="414.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#78350f" text-anchor="middle">actually cost you</text><line x1="1012" y1="370" x2="1126" y2="370" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1130" y="260" width="400" height="220" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1330.0" y="349.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#14532d" text-anchor="middle">3. The fix</text><text x="1330.0" y="381.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">what you changed,</text><text x="1330.0" y="414.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">and the result</text><text x="90" y="610" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Avoid: &quot;I&#x27;m a perfectionist&quot;, &quot;I work too hard&quot;, or a weakness that is the core skill of the role.</text><text x="90" y="660" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">End on the improvement, not the problem.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>