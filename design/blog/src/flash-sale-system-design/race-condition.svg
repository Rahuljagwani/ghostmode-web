<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">The oversell bug: read, then write</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Two buyers read the same stock before either one writes</text><text x="80" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#475569" text-anchor="start">Time</text><line x1="80" y1="250" x2="1520" y2="250" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="80" y="300" width="300" height="110" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="230.0" y="365.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0c4a6e" text-anchor="middle">Buyer A</text><rect x="80" y="560" width="300" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="230.0" y="625.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#78350f" text-anchor="middle">Buyer B</text><rect x="470" y="300" width="300" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="620.0" y="363.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d" text-anchor="middle">reads stock = 1</text><rect x="470" y="560" width="300" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="620.0" y="623.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d" text-anchor="middle">reads stock = 1</text><rect x="830" y="300" width="300" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="980.0" y="363.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d" text-anchor="middle">writes stock = 0</text><rect x="830" y="560" width="300" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="980.0" y="623.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d" text-anchor="middle">writes stock = 0</text><rect x="1190" y="300" width="300" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1340.0" y="363.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d" text-anchor="middle">order confirmed</text><rect x="1190" y="560" width="300" height="110" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1340.0" y="623.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#7f1d1d" text-anchor="middle">order confirmed</text><line x1="382" y1="355" x2="466" y2="355" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="772" y1="355" x2="826" y2="355" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="1132" y1="355" x2="1186" y2="355" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="382" y1="615" x2="466" y2="615" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="772" y1="615" x2="826" y2="615" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="1132" y1="615" x2="1186" y2="615" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="410.0" y="460" width="420.00000000000006" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="620" y="486.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">both read 1 in the same millisecond</text><text x="80" y="780" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Stock was 1. Two orders were confirmed. The fix: make check and subtract a single step.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>