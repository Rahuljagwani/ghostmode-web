<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Flash sale checkout that never oversells</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Five layers, each closing one way the sale can break</text><rect x="60" y="330" width="230" height="150" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="175.0" y="401.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#78350f" text-anchor="middle">Buyers</text><text x="175.0" y="428.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78350f" text-anchor="middle">10,000 at once</text><rect x="360" y="320" width="260" height="170" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="490.0" y="389.40000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#4c1d95" text-anchor="middle">Waiting room</text><text x="490.0" y="414.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4c1d95" text-anchor="middle">lets people in at</text><text x="490.0" y="438.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4c1d95" text-anchor="middle">a steady rate</text><rect x="690" y="320" width="260" height="170" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="820.0" y="389.40000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="middle">Checkout API</text><text x="820.0" y="414.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0c4a6e" text-anchor="middle">one request</text><text x="820.0" y="438.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0c4a6e" text-anchor="middle">per buyer</text><rect x="1020" y="180" width="300" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1170.0" y="251.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d" text-anchor="middle">Redis counter</text><text x="1170.0" y="276.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#14532d" text-anchor="middle">DECR, or 10 buckets</text><rect x="1020" y="480" width="300" height="150" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1170.0" y="539.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">Reservation</text><text x="1170.0" y="564.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">held for 10 min,</text><text x="1170.0" y="588.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">then expires</text><rect x="1020" y="700" width="300" height="130" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1170.0" y="761.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="middle">Payment</text><text x="1170.0" y="786.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0c4a6e" text-anchor="middle">idempotency key</text><rect x="1390" y="700" width="170" height="130" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="1475.0" y="762.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Orders DB</text><text x="1475.0" y="784.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#0f172a" text-anchor="middle">source of truth</text><line x1="292" y1="405" x2="356" y2="405" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="622" y1="405" x2="686" y2="405" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="952" y1="360" x2="1016" y2="270" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="838.4" y="285.0" width="151.20000000000002" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="914.0" y="311.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">1. take one</text><line x1="952" y1="420" x2="1016" y2="540" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="844.0" y="490.0" width="140.0" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="914.0" y="516.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">2. hold it</text><line x1="1170" y1="632" x2="1170" y2="696" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1182.4" y="644.0" width="95.2" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1230.0" y="670.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">3. pay</text><line x1="1322" y1="765" x2="1386" y2="765" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1284.0" y="670.0" width="140.0" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1354.0" y="696.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">4. confirm</text><path d="M 1322 540 C 1430 480, 1430 330, 1324 280" fill="none" stroke="#475569" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#head)"/><rect x="1304.0" y="390" width="252.00000000000003" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1430" y="416.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">expired: put it back</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>