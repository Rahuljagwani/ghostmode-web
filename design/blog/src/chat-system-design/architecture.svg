<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Chat app: high-level design</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Long-lived connections on gateways; messages stored once, then routed to the receiver</text><rect x="60" y="250" width="220" height="120" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="170.0" y="306.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">Alice</text><text x="170.0" y="334.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0f172a" text-anchor="middle">phone</text><rect x="60" y="560" width="220" height="120" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="170.0" y="616.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">Bob</text><text x="170.0" y="644.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0f172a" text-anchor="middle">laptop</text><rect x="380" y="250" width="280" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="520.0" y="306.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0c4a6e" text-anchor="middle">Gateway 1</text><text x="520.0" y="334.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0c4a6e" text-anchor="middle">WebSocket</text><rect x="380" y="560" width="280" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="520.0" y="616.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0c4a6e" text-anchor="middle">Gateway 2</text><text x="520.0" y="644.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0c4a6e" text-anchor="middle">WebSocket</text><rect x="700" y="400" width="260" height="130" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="830.0" y="461.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#4c1d95" text-anchor="middle">Chat service</text><text x="830.0" y="489.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#4c1d95" text-anchor="middle">IDs, store, route</text><rect x="1190" y="210" width="340" height="130" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1360.0" y="271.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#78350f" text-anchor="middle">Message store</text><text x="1360.0" y="298.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78350f" text-anchor="middle">by conversation, in order</text><rect x="1190" y="400" width="340" height="130" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1360.0" y="461.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#14532d" text-anchor="middle">Session registry</text><text x="1360.0" y="488.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14532d" text-anchor="middle">user -&gt; gateway</text><rect x="1190" y="590" width="340" height="130" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1360.0" y="651.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#7f1d1d" text-anchor="middle">Push service</text><text x="1360.0" y="678.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#7f1d1d" text-anchor="middle">if receiver offline</text><line x1="282" y1="310" x2="376" y2="310" stroke="#475569" stroke-width="3.5" marker-start="url(#head)" marker-end="url(#head)"/><line x1="282" y1="620" x2="376" y2="620" stroke="#475569" stroke-width="3.5" marker-start="url(#head)" marker-end="url(#head)"/><line x1="662" y1="340" x2="696" y2="420" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="685.8" y="354.0" width="106.4" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="739.0" y="380.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">1. send</text><line x1="962" y1="420" x2="1186" y2="290" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1010.8" y="327.0" width="106.4" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1064.0" y="353.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">2. save</text><line x1="962" y1="465" x2="1186" y2="465" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="970.4" y="423.0" width="207.20000000000002" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1074.0" y="449.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">3. where is Bob?</text><line x1="696" y1="510" x2="662" y2="590" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="679.0" y="544.0" width="140.0" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="749.0" y="570.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">4. deliver</text><line x1="962" y1="510" x2="1186" y2="640" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="999.6" y="577.0" width="128.8" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1064.0" y="603.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">else push</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>