<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Message delivery states</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Each tick is an acknowledgement travelling back to the sender</text><rect x="80" y="300" width="320" height="200" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="240.0" y="379.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a" text-anchor="middle">Sending</text><text x="240.0" y="411.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0f172a" text-anchor="middle">on the phone,</text><text x="240.0" y="444.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0f172a" text-anchor="middle">not saved yet</text><line x1="402" y1="400" x2="456" y2="400" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="460" y="300" width="320" height="200" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="620.0" y="379.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0c4a6e" text-anchor="middle">Sent</text><text x="620.0" y="411.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0c4a6e" text-anchor="middle">server saved it</text><text x="620.0" y="444.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0c4a6e" text-anchor="middle">and gave it an ID</text><line x1="782" y1="400" x2="836" y2="400" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="840" y="300" width="320" height="200" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1000.0" y="379.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#4c1d95" text-anchor="middle">Delivered</text><text x="1000.0" y="411.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4c1d95" text-anchor="middle">receiver&#x27;s device</text><text x="1000.0" y="444.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4c1d95" text-anchor="middle">acknowledged it</text><line x1="1162" y1="400" x2="1216" y2="400" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1220" y="300" width="320" height="200" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1380.0" y="379.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#14532d" text-anchor="middle">Read</text><text x="1380.0" y="411.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">receiver opened</text><text x="1380.0" y="444.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">the conversation</text><text x="80" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Retries are safe because the client sends a client message ID: the server ignores repeats.</text><text x="80" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">Offline receiver: the message waits in the store and a push notification wakes the app.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>