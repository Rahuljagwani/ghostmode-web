<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">The agent loop</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">The model decides the next step; your code runs it and feeds the result back</text><rect x="80" y="360" width="260" height="150" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="210.0" y="431.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">Goal</text><text x="210.0" y="459.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0f172a" text-anchor="middle">user request</text><rect x="440" y="250" width="320" height="150" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="600.0" y="307.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0c4a6e" text-anchor="middle">LLM decides</text><text x="600.0" y="335.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0c4a6e" text-anchor="middle">answer, or call</text><text x="600.0" y="364.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0c4a6e" text-anchor="middle">a tool?</text><rect x="880" y="250" width="320" height="150" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1040.0" y="307.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#78350f" text-anchor="middle">Run the tool<