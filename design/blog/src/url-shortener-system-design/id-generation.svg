<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Generating short codes without collisions</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Each API server takes a block of numbers, then encodes each number in base62</text><rect x="80" y="230" width="380" height="170" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="270.0" y="295.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#14532d" text-anchor="middle">Counter service</text><text x="270.0" y="326.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14532d" text-anchor="middle">hands out blocks</text><text x="270.0" y="356.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14532d" text-anchor="middle">of 1,000 IDs</text><rect x="620" y="200" width="330" height="110" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="785.0" y="251.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">Server 1</text><text x="785.0" y="278.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">IDs 1,000,000-1,000,999</text><rect x="620" y="340" width="330" height="110" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="785.0" y="391.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">Server 2</text><text x="785.0" y="418.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">IDs 1,001,000-1,001,999</text><line x1="462" y1="290" x2="616" y2="255" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="462" y1="340" x2="616" y2="395" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1100" y="250" width="420" height="170" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1310.0" y="317.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#78350f" text-anchor="middle">base62(1,000,123)</text><text x="1310.0" y="345.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#78350f" text-anchor="middle">= &quot;4cb1&quot;</text><text x="1310.0" y="374.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#78350f" text-anchor="middle">alphabet 0-9, a-z, A-Z</text><line x1="952" y1="330" x2="1096" y2="330" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="976.4" y="296.0" width="95.2" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1024.0" y="322.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">encode</text><text x="80" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#475569" text-anchor="start">7 base62 characters give 62^7, about 3.5 trillion codes.</text><text x="80" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">No collision checks: every number is used once.</text><text x="80" y="670" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">A crashed server only wastes the rest of its block.</text><text x="80" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">Sequential codes are guessable: shuffle the number first if links must not be enumerable.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>