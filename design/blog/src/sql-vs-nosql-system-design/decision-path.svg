<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">SQL or NoSQL? A quick decision path</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Start from the access patterns, not the brand name</text><rect x="560" y="180" width="480" height="120" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="800.0" y="236.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="middle">Do you need joins or</text><text x="800.0" y="264.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0f172a" text-anchor="middle">multi-row transactions?</text><rect x="120" y="420" width="420" height="130" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="330.0" y="481.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0c4a6e" text-anchor="middle">Relational (SQL)</text><text x="330.0" y="511.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#0c4a6e" text-anchor="middle">Postgres, MySQL</text><rect x="1060" y="400" width="460" height="150" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="1290.0" y="458.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Are the access patterns</text><text x="1290.0" y="484.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">known and key-based</text><text x="1290.0" y="511.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">at very high scale?</text><rect x="820" y="680" width="340" height="130" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="990.0" y="741.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#4c1d95" text-anchor="middle">Key-value / wide-column</text><text x="990.0" y="766.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4c1d95" text-anchor="middle">DynamoDB, Cassandra</text><rect x="1220" y="680" width="330" height="130" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1385.0" y="728.1999999999999" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">Start with SQL</text><text x="1385.0" y="754.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">it scales further</text><text x="1385.0" y="781.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">than most need</text><line x1="700" y1="302" x2="400" y2="416" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="499.2" y="325.0" width="61.6" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="530.0" y="351.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">yes</text><line x1="900" y1="302" x2="1200" y2="396" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1044.8" y="315.0" width="50.400000000000006" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1070.0" y="341.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">no</text><line x1="1200" y1="552" x2="1000" y2="676" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1039.2" y="580.0" width="61.6" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1070.0" y="606.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">yes</text><line x1="1380" y1="552" x2="1385" y2="676" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1387.3" y="594.0" width="50.400000000000006" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1412.5" y="620.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">no</text><text x="120" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">Documents with flexible</text><text x="120" y="672" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">shape: MongoDB or JSONB</text><text x="120" y="704" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">columns in Postgres.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>