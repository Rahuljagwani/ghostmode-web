<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">hash(key) % N vs a hash ring</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">What happens to 1,000,000 cached keys when you go from 4 to 5 servers</text><rect x="90" y="230" width="660" height="300" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="420.0" y="341.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#7f1d1d" text-anchor="middle">hash(key) % N</text><text x="420.0" y="375.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#7f1d1d" text-anchor="middle">N changes from 4 to 5,</text><text x="420.0" y="409.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#7f1d1d" text-anchor="middle">so most keys map to a new server.</text><text x="420.0" y="443.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#7f1d1d" text-anchor="middle">About 80% of keys move.</text><rect x="850" y="230" width="660" height="300" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1180.0" y="341.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#14532d" text-anchor="middle">Hash ring</text><text x="1180.0" y="375.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#14532d" text-anchor="middle">The new server takes one slice</text><text x="1180.0" y="409.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#14532d" text-anchor="middle">of the ring. About 1/5 of keys</text><text x="1180.0" y="443.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#14532d" text-anchor="middle">move (roughly 1/N).</text><text x="90" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">With a cache, every moved key is a cache miss that hits the database at once.</text><text x="90" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">Virtual nodes: give each server many points on the ring (for example 100 to 200),</text><text x="90" y="735" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">so load spreads evenly and a leaving server&#x27;s keys spread over all the others.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>