<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">The hash ring</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Each key goes to the first server clockwise from its position</text><circle cx="470" cy="520" r="270" fill="none" stroke="#94a3b8" stroke-width="4"/><circle cx="562.3454386979306" cy="266.28299238780477" r="46" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="562.3454386979306" y="278.28299238780477" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0c4a6e" text-anchor="middle">A</text><circle cx="643.5526546153657" cy="726.8319996421241" r="46" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="643.5526546153657" y="738.8319996421241" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#14532d" text-anchor="middle">B</text><circle cx="209.20002690195156" cy="589.8811421776807" r="46" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="209.20002690195156" y="601.8811421776807" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#4c1d95" text-anchor="middle">C</text><circle cx="723.7170076121953" cy="427.65456130206945" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="657.9385241571817" y="460.59597133486625" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#78350f" text-anchor="middle">k1</text><circle cx="423.1149920299288" cy="785.8980933132962" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="435.27036446661396" y="725.9615506024415" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#78350f" text-anchor="middle">k2</text><circle cx="296.44734538463433" cy="313.16800035787594" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="341.4424780626921" y="375.7911113762044" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#78350f" text-anchor="middle">k3</text><text x="470" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#64748b" text-anchor="middle">hash space</text><text x="470" y="544" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="400" fill="#64748b" text-anchor="middle">0 to 2^32</text><text x="880" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#475569" text-anchor="start">k1 goes to B, k2 goes to C, k3 goes to A.</text><text x="880" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Add server D between A and B:</text><text x="880" y="425" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">only the keys between A and D move to D.</text><text x="880" y="505" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Remove server B:</text><text x="880" y="550" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">only B&#x27;s keys move, to the next server (C).</text><text x="880" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#16a34a" text-anchor="start">Every other key stays where it was.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>