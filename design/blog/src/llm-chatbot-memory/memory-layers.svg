<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">What goes into each request</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">A bounded prompt instead of the whole conversation</text><rect x="80" y="230" width="330" height="110" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="245.0" y="294.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">System prompt</text><rect x="80" y="360" width="330" height="110" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="245.0" y="411.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#4c1d95" text-anchor="middle">Key facts</text><text x="245.0" y="438.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#4c1d95" text-anchor="middle">retrieved for this turn</text><rect x="80" y="490" width="330" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="245.0" y="541.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#78350f" text-anchor="middle">Running summary</text><text x="245.0" y="568.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78350f" text-anchor="middle">of older turns</text><rect x="80" y="620" width="330" height="110" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="245.0" y="671.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">Last few turns</text><text x="245.0" y="698.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">word for word</text><line x1="412" y1="480" x2="600" y2="480" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="458.4" y="438.0" width="95.2" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="506.0" y="464.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">prompt</text><rect x="605" y="400" width="300" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="755.0" y="475.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#14532d" text-anchor="middle">LLM</text><text x="755.0" y="508.05" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">reply</text><line x1="907" y1="480" x2="1080" y2="480" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="901.1" y="438.0" width="184.8" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="993.5" y="464.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">after the turn</text><rect x="1085" y="300" width="430" height="130" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1300.0" y="361.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">Update summary</text><text x="1300.0" y="386.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">every few turns, cheaper model</text><rect x="1085" y="520" width="430" height="130" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1300.0" y="581.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#4c1d95" text-anchor="middle">Extract new facts</text><text x="1300.0" y="606.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4c1d95" text-anchor="middle">name, goals, preferences</text><text x="80" y="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">Tokens per turn stay roughly flat instead of growing with every message.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>