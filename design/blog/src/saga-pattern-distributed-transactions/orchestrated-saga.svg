<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">An orchestrated saga, with compensations</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Each step commits locally. If a later step fails, earlier steps are undone in reverse</text><rect x="90" y="260" width="290" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="235.0" y="331.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#14532d" text-anchor="middle">Create order</text><text x="235.0" y="358.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14532d" text-anchor="middle">PENDING</text><rect x="470" y="260" width="290" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="615.0" y="331.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#14532d" text-anchor="middle">Charge payment</text><text x="615.0" y="358.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14532d" text-anchor="middle">$49 captured</text><rect x="850" y="260" width="290" height="150" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="995.0" y="331.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#7f1d1d" text-anchor="middle">Reserve stock</text><text x="995.0" y="358.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#7f1d1d" text-anchor="middle">out of stock</text><rect x="1230" y="260" width="290" height="150" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/><text x="1375.0" y="331.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Ship</text><text x="1375.0" y="358.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">never runs</text><line x1="382" y1="335" x2="466" y2="335" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="762" y1="335" x2="846" y2="335" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="1142" y1="335" x2="1226" y2="335" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><text x="1000" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#dc2626" text-anchor="middle">fails</text><rect x="470" y="560" width="290" height="140" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="615.0" y="626.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">Refund payment</text><text x="615.0" y="651.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">compensation</text><rect x="90" y="560" width="290" height="140" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="235.0" y="626.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">Cancel order</text><text x="235.0" y="651.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">compensation</text><path d="M 995 412 C 995 520, 860 630, 764 630" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="851.8" y="525" width="106.4" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="905" y="551.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">1. undo</text><line x1="466" y1="630" x2="384" y2="630" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="371.8" y="588.0" width="106.4" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="425.0" y="614.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">2. undo</text><text x="80" y="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">The orchestrator stores saga state, retries steps, and runs compensations. Every step and</text><text x="80" y="836" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">compensation must be idempotent, because messages can be delivered more than once.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>