<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">What a few interviews actually cost</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Example: 4 one-hour interviews in one month, using the cheapest option that covers them</text><text x="496" y="240.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="end">Ghost (450 credits, $19)</text><rect x="520" y="200" width="72.2" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="610.2" y="240.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d" text-anchor="start">$19 once, credits left over</text><text x="496" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="end">ParakeetAI (4 credits)</text><rect x="520" y="288" width="243.2" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="781.2" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0c4a6e" text-anchor="start">$64 (3 for $39 + 1 for $25)</text><text x="496" y="416.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="end">LockedIn AI (1 month)</text><rect x="520" y="376" width="250.8" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="788.8" y="416.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0c4a6e" text-anchor="start">about $66 with promo</text><text x="496" y="504.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="end">Cluely Pro + Undetectability</text><rect x="520" y="464" width="569.962" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1107.962" y="504.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0c4a6e" text-anchor="start">$149.99</text><text x="496" y="592.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="end">Final Round AI (monthly)</text><rect x="520" y="552" width="570.0" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1108.0" y="592.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0c4a6e" text-anchor="start">$150</text><text x="80" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="start">Ghost charges per question: a typical interview uses 50 to 60 credits, about $2 to $3.</text><text x="80" y="765" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Subscriptions cost the same whether you have 1 interview that month or 20.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>