<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Prompt caching: reuse the stable prefix</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Put what never changes first. Only the end of the prompt is new each time</text><text x="80" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#475569" text-anchor="start">Request 1</text><rect x="80" y="275" width="900" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="530.0" y="326.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">System prompt + docs + examples</text><text x="530.0" y="351.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">6,000 tokens, written to cache</text><rect x="990" y="275" width="300" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1140.0" y="326.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="middle">Question</text><text x="1140.0" y="351.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0c4a6e" text-anchor="middle">120 tokens</text><text x="80" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#475569" text-anchor="start">Request 2 (within the cache lifetime)</text><rect x="80" y="495" width="900" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="530.0" y="546.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d" text-anchor="middle">Same prefix, read from cache</text><text x="530.0" y="571.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#14532d" text-anchor="middle">billed at a fraction of the price</text><rect x="990" y="495" width="300" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1140.0" y="546.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="middle">New question</text><text x="1140.0" y="571.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0c4a6e" text-anchor="middle">140 tokens</text><text x="1330" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="start">full price</text><text x="1330" y="560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="start">cheaper and</text><text x="1330" y="592" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="start">faster</text><text x="80" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Anything that changes per user (name, date, history) must go after the cached part,</text><text x="80" y="756" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">or the prefix no longer matches and nothing is reused.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>