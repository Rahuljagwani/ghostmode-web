<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Routing and streaming</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Send easy requests to a small model, and show tokens as they arrive</text><rect x="70" y="330" width="230" height="150" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="185.0" y="414.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">Request</text><rect x="390" y="300" width="300" height="210" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="540.0" y="388.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#4c1d95" text-anchor="middle">Router</text><text x="540.0" y="414.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#4c1d95" text-anchor="middle">easy -&gt; small model</text><text x="540.0" y="441.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#4c1d95" text-anchor="middle">hard -&gt; large model</text><rect x="800" y="190" width="330" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="965.0" y="266.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#14532d" text-anchor="middle">Small model</text><text x="965.0" y="293.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14532d" text-anchor="middle">fast, cheap</text><rect x="800" y="460" width="330" height="160" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="965.0" y="536.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#78350f" text-anchor="middle">Large model</text><text x="965.0" y="563.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78350f" text-anchor="middle">slower, better</text><rect x="1230" y="320" width="300" height="170" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="1380.0" y="389.40000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="middle">Stream tokens</text><text x="1380.0" y="414.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0c4a6e" text-anchor="middle">first words appear</text><text x="1380.0" y="438.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0c4a6e" text-anchor="middle">before the answer ends</text><line x1="300" y1="405" x2="386" y2="405" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="692" y1="360" x2="796" y2="280" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="692" y1="450" x2="796" y2="535" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="1132" y1="270" x2="1226" y2="370" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="1132" y1="540" x2="1226" y2="445" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><text x="80" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Also: cache repeated prompt prefixes, cap output length, and batch offline work.</text><text x="80" y="760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Measure time to first token and cost per request before and after each change.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>