<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Composite index: column order matters</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">INDEX ON orders (customer_id, created_at)  -  the leftmost-prefix rule</text><rect x="80" y="200" width="900" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="530.0" y="259.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle"></text><text x="110" y="260" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">WHERE customer_id = 7</text><rect x="1020" y="200" width="500" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1270.0" y="258.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d" text-anchor="middle">Uses index</text><rect x="80" y="340" width="900" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="530.0" y="399.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle"></text><text x="110" y="400" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">WHERE customer_id = 7 AND created_at &gt; &#x27;2026-11-01&#x27;</text><rect x="1020" y="340" width="500" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1270.0" y="398.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d" text-anchor="middle">Uses index (both columns)</text><rect x="80" y="480" width="900" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="530.0" y="539.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle"></text><text x="110" y="540" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">WHERE customer_id = 7 ORDER BY created_at DESC</text><rect x="1020" y="480" width="500" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1270.0" y="538.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#14532d" text-anchor="middle">Uses index, no sort needed</text><rect x="80" y="620" width="900" height="100" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="530.0" y="679.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle"></text><text x="110" y="680" font-family="Menlo, Monaco, monospace" font-size="24" font-weight="400" fill="#0f172a" text-anchor="start">WHERE created_at &gt; &#x27;2026-11-01&#x27;</text><rect x="1020" y="620" width="500" height="100" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1270.0" y="678.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#7f1d1d" text-anchor="middle">Can&#x27;t use it well: skips the first column</text><text x="80" y="820" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Put equality columns first, then the range or sort column. Check with EXPLAIN.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>