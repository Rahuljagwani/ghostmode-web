<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">OFFSET vs cursor pagination</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Same page 10,001, very different work</text><rect x="80" y="260" width="680" height="200" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="420.0" y="340.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#7f1d1d" text-anchor="middle">OFFSET 200000 LIMIT 20</text><text x="420.0" y="371.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#7f1d1d" text-anchor="middle">reads 200,020 rows</text><text x="420.0" y="401.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#7f1d1d" text-anchor="middle">throws away 200,000</text><rect x="840" y="260" width="680" height="200" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1180.0" y="342.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14532d" text-anchor="middle">WHERE id &gt; :last_id LIMIT 20</text><text x="1180.0" y="370.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14532d" text-anchor="middle">jumps to the cursor in the index</text><text x="1180.0" y="399.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14532d" text-anchor="middle">reads 20 rows</text><text x="80" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Cost grows with page depth.</text><text x="840" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Cost is the same on every page.</text><text x="80" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Trade-off: cursors can&#x27;t jump to page 7,431. Most feeds and infinite scroll don&#x27;t need to.</text><text x="80" y="790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="start">PostgreSQL manual: rows skipped by OFFSET still have to be computed inside the server.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>