<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Why the cursor needs a tie-breaker</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Two rows with the same created_at sit on a page boundary</text><rect x="80" y="220" width="420" height="85" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="290.0" y="271.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">10:00:05  id 91</text><rect x="80" y="325" width="420" height="85" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="290.0" y="376.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">10:00:04  id 88</text><rect x="80" y="430" width="420" height="85" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="290.0" y="481.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">10:00:04  id 87</text><rect x="80" y="535" width="420" height="85" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="290.0" y="586.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">10:00:03  id 80</text><text x="515" y="428" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#d97706" text-anchor="start">&lt; page 1 ends</text><text x="720" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Cursor on created_at only:</text><text x="720" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#dc2626" text-anchor="start">WHERE created_at &lt; &#x27;10:00:04&#x27; skips id 87.</text><text x="720" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Cursor on (created_at, id):</text><text x="720" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#16a34a" text-anchor="start">WHERE (created_at, id) &lt; (&#x27;10:00:04&#x27;, 88)</text><text x="720" y="506" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">returns id 87 next. Nothing skipped or repeated.</text><text x="720" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Index: (created_at, id), same order as the sort.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>