<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">The range method</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Research the market, then give a range whose bottom you&#x27;d happily accept</text><rect x="160" y="330" width="1280" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><rect x="760" y="330" width="440" height="40" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><line x1="160" y1="300" x2="160" y2="400" stroke="#64748b" stroke-width="3"/><text x="160" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="middle">low end of market</text><line x1="800" y1="300" x2="800" y2="400" stroke="#64748b" stroke-width="3"/><text x="800" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="middle">market median</text><line x1="1440" y1="300" x2="1440" y2="400" stroke="#64748b" stroke-width="3"/><text x="1440" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="middle">high end of market</text><text x="980" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#14532d" text-anchor="middle">your range</text><text x="160" y="540" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">1. Research: the job post range, salary sites, people in similar roles.</text><text x="160" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">2. Set your floor: the lowest number you&#x27;d accept without regret.</text><text x="160" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">3. Range = floor to about 15-20% above it, placed around or above the median.</text><text x="160" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">4. Say it once, calmly, then talk about the whole package.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>