<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">The resume bullet point formula</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Action verb + what you did + how + measurable result</text><rect x="80" y="230" width="320" height="180" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="240.0" y="299.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0c4a6e" text-anchor="middle">Action verb</text><text x="240.0" y="331.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0c4a6e" text-anchor="middle">Built, cut, led,</text><text x="240.0" y="364.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0c4a6e" text-anchor="middle">automated</text><line x1="402" y1="320" x2="456" y2="320" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="460" y="230" width="320" height="180" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="620.0" y="299.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#4c1d95" text-anchor="middle">What</text><text x="620.0" y="331.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4c1d95" text-anchor="middle">the task or</text><text x="620.0" y="364.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4c1d95" text-anchor="middle">system</text><line x1="782" y1="320" x2="836" y2="320" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="840" y="230" width="320" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1000.0" y="299.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#78350f" text-anchor="middle">How</text><text x="1000.0" y="331.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#78350f" text-anchor="middle">tools, approach,</text><text x="1000.0" y="364.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#78350f" text-anchor="middle">scope</text><line x1="1162" y1="320" x2="1216" y2="320" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1220" y="230" width="320" height="180" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1380.0" y="299.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#14532d" text-anchor="middle">Result</text><text x="1380.0" y="331.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">a number:</text><text x="1380.0" y="364.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">%, time, $, users</text><text x="80" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#dc2626" text-anchor="start">Before:</text><text x="200" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">Responsible for the checkout API.</text><text x="80" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#16a34a" text-anchor="start">After:</text><text x="200" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">Rebuilt the checkout API with Redis caching and async payment calls,</text><text x="200" y="630" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">cutting p95 latency from 900 ms to 250 ms during peak sales.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>