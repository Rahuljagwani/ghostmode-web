<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Why a lock with a timeout isn&#x27;t enough</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Client 1 pauses, its lock expires, and two clients think they hold it. Fencing tokens fix this.</text><text x="80" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="start">Client 1</text><line x1="330" y1="280" x2="1520" y2="280" stroke="#cbd5e1" stroke-width="3"/><text x="80" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#4c1d95" text-anchor="start">Client 2</text><line x1="330" y1="470" x2="1520" y2="470" stroke="#cbd5e1" stroke-width="3"/><text x="80" y="668" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="start">Storage</text><line x1="330" y1="660" x2="1520" y2="660" stroke="#cbd5e1" stroke-width="3"/><rect x="360" y="262" width="160" height="36" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="440" y="287" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d" text-anchor="middle">lock, token 33</text><rect x="540" y="262" width="740" height="36" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="910" y="287" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7f1d1d" text-anchor="middle">long GC pause (its lock expires meanwhile)</text><rect x="950" y="452" width="170" height="36" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1035" y="477" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d" text-anchor="middle">lock, token 34</text><line x1="1140" y1="480" x2="1140" y2="648" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1145.6" y="544.0" width="128.8" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1210.0" y="570.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">write, 34</text><line x1="1300" y1="290" x2="1300" y2="648" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1305.6" y="489.0" width="128.8" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1370.0" y="515.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">write, 33</text><text x="1140" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#16a34a" text-anchor="middle">accepted</text><text x="1300" y="720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle">rejected: 33 &lt; 34</text><text x="80" y="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="start">The storage keeps the highest token it has seen and refuses older ones.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>