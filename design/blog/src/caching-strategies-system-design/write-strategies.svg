<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Three ways to write with a cache</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Where the write goes first decides speed, freshness and risk</text><rect x="90" y="190" width="430" height="110" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="305.0" y="256.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0c4a6e" text-anchor="middle">Cache-aside</text><rect x="120" y="340" width="370" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="305.0" y="386.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Step 1</text><text x="305.0" y="411.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle">App writes DB</text><rect x="120" y="480" width="370" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="305.0" y="526.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Step 2</text><text x="305.0" y="551.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle">App deletes cache key</text><line x1="305" y1="440" x2="305" y2="476" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><text x="305" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="middle">Simple, cache only holds</text><text x="305" y="675" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="middle">what&#x27;s actually read</text><rect x="585" y="190" width="430" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="800.0" y="256.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#14532d" text-anchor="middle">Write-through</text><rect x="615" y="340" width="370" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="800.0" y="386.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Step 1</text><text x="800.0" y="411.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle">App writes cache</text><rect x="615" y="480" width="370" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="800.0" y="526.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Step 2</text><text x="800.0" y="551.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle">Cache writes DB (same request)</text><line x1="800" y1="440" x2="800" y2="476" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><text x="800" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="middle">Cache always fresh,</text><text x="800" y="675" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="middle">writes a bit slower</text><rect x="1080" y="190" width="430" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1295.0" y="256.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#78350f" text-anchor="middle">Write-back</text><rect x="1110" y="340" width="370" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="1295.0" y="386.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Step 1</text><text x="1295.0" y="411.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle">App writes cache</text><rect x="1110" y="480" width="370" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="1295.0" y="526.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Step 2</text><text x="1295.0" y="551.45" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle">Cache flushes DB later</text><line x1="1295" y1="440" x2="1295" y2="476" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><text x="1295" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="middle">Fastest writes, but data</text><text x="1295" y="675" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="middle">is lost if cache dies first</text><text x="80" y="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Default for most read-heavy apps: cache-aside with a TTL, and delete (not update) the key on write.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>