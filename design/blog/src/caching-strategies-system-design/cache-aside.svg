<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Cache-aside: the app manages the cache</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Read path on a cache miss, and how a write invalidates</text><rect x="110" y="330" width="300" height="170" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="260.0" y="398.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0c4a6e" text-anchor="middle">App server</text><text x="260.0" y="424.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">your code decides</text><text x="260.0" y="451.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0c4a6e" text-anchor="middle">what to cache</text><rect x="650" y="210" width="320" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="810.0" y="268.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#14532d" text-anchor="middle">Cache</text><text x="810.0" y="294.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14532d" text-anchor="middle">Redis / Memcached</text><text x="810.0" y="321.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#14532d" text-anchor="middle">key -&gt; value, with TTL</text><rect x="650" y="560" width="320" height="150" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="810.0" y="631.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Database</text><text x="810.0" y="658.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">source of truth</text><line x1="410" y1="370" x2="645" y2="290" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="435.1" y="288.0" width="184.8" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="527.5" y="314.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">1. GET user:42</text><line x1="645" y1="330" x2="410" y2="410" stroke="#dc2626" stroke-width="3.5" marker-end="url(#head)"/><rect x="474.3" y="376.0" width="106.4" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="527.5" y="402.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">2. miss</text><line x1="410" y1="450" x2="645" y2="610" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="452.29999999999995" y="474.0" width="330.40000000000003" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="617.5" y="500.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">3. SELECT ... WHERE id = 42</text><path d="M 975 620 C 1100 560, 1100 360, 975 300" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1044.8" y="440" width="330.40000000000003" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1210" y="466.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">4. SET user:42 (TTL 10 min)</text><rect x="1180" y="640" width="360" height="140" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1360.0" y="694.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="middle">On write</text><text x="1360.0" y="719.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">update the DB, then</text><text x="1360.0" y="743.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#78350f" text-anchor="middle">DELETE the cache key</text><text x="80" y="840" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Next read of user:42 is a cache hit until the TTL expires or the key is deleted.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>