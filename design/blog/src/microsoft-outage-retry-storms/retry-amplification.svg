<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">How retries multiply load</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Each layer retries up to 4 times: one click becomes 64 database attempts</text><rect x="70" y="330" width="320" height="170" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="230.0" y="410.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0c4a6e" text-anchor="middle">1 click</text><text x="230.0" y="443.05" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0c4a6e" text-anchor="middle">frontend</text><rect x="450" y="330" width="320" height="170" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="610.0" y="410.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#78350f" text-anchor="middle">4 attempts</text><text x="610.0" y="443.05" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#78350f" text-anchor="middle">API layer</text><rect x="830" y="330" width="320" height="170" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="990.0" y="410.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#78350f" text-anchor="middle">16 attempts</text><text x="990.0" y="443.05" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#78350f" text-anchor="middle">service layer</text><rect x="1210" y="330" width="320" height="170" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1370.0" y="410.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#7f1d1d" text-anchor="middle">64 attempts</text><text x="1370.0" y="443.05" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#7f1d1d" text-anchor="middle">database</text><line x1="390" y1="415" x2="446" y2="415" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="392.8" y="365.0" width="50.400000000000006" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="418.0" y="391.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">x4</text><line x1="770" y1="415" x2="826" y2="415" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="772.8" y="365.0" width="50.400000000000006" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="798.0" y="391.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">x4</text><line x1="1150" y1="415" x2="1206" y2="415" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1152.8" y="365.0" width="50.400000000000006" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1178.0" y="391.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">x4</text><text x="80" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">The overloaded database sees 64 times the load at exactly the moment it can least handle it.</text><text x="80" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569" text-anchor="start">Fix: retry at one layer only, cap attempts, add backoff with jitter, and keep a retry budget.</text><text x="80" y="790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="start">Example from the Google SRE book, &quot;Addressing Cascading Failures&quot;.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>