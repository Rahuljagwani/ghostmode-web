<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Circuit breaker: three states</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Stop calling a dependency that is clearly down, then test it carefully</text><rect x="90" y="330" width="360" height="180" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="270.0" y="399.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#14532d" text-anchor="middle">Closed</text><text x="270.0" y="431.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">calls go through,</text><text x="270.0" y="464.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">failures are counted</text><rect x="620" y="330" width="360" height="180" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="800.0" y="399.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#7f1d1d" text-anchor="middle">Open</text><text x="800.0" y="431.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#7f1d1d" text-anchor="middle">fail fast, don&#x27;t call</text><text x="800.0" y="464.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#7f1d1d" text-anchor="middle">the dependency at all</text><rect x="1150" y="330" width="360" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1330.0" y="399.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#78350f" text-anchor="middle">Half-open</text><text x="1330.0" y="431.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#78350f" text-anchor="middle">let a few test</text><text x="1330.0" y="464.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#78350f" text-anchor="middle">calls through</text><line x1="452" y1="390" x2="616" y2="390" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="424.8" y="342.0" width="218.4" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="534.0" y="368.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">too many failures</text><line x1="982" y1="390" x2="1146" y2="390" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="971.6" y="342.0" width="184.8" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1064.0" y="368.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">cool-down ends</text><path d="M 1330 512 C 1330 680, 270 680, 270 514" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="685.2" y="635" width="229.60000000000002" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="800" y="661.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">test calls succeed</text><path d="M 1250 330 C 1180 230, 900 230, 840 326" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="947.0" y="215" width="196.00000000000003" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1045" y="241.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">test calls fail</text><text x="80" y="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Retries handle short blips. A circuit breaker stops the flood when a dependency is clearly down.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>