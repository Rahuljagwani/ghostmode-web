<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Which one should you use?</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Start from who needs to send messages, and how often</text><rect x="80" y="230" width="440" height="420" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="300.0" y="344.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#78350f" text-anchor="middle">Long polling</text><text x="300.0" y="375.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#78350f" text-anchor="middle">Updates are rare,</text><text x="300.0" y="405.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#78350f" text-anchor="middle">or nothing else works</text><text x="300.0" y="436.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#78350f" text-anchor="middle"></text><text x="300.0" y="466.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#78350f" text-anchor="middle">Simple, works</text><text x="300.0" y="496.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#78350f" text-anchor="middle">everywhere</text><text x="300.0" y="527.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#78350f" text-anchor="middle">Extra requests</text><text x="300.0" y="557.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#78350f" text-anchor="middle">and latency</text><rect x="580" y="230" width="440" height="420" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="800.0" y="344.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#14532d" text-anchor="middle">SSE</text><text x="800.0" y="375.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14532d" text-anchor="middle">Server to client only:</text><text x="800.0" y="405.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14532d" text-anchor="middle">feeds, notifications,</text><text x="800.0" y="436.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14532d" text-anchor="middle">LLM token streaming</text><text x="800.0" y="466.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14532d" text-anchor="middle"></text><text x="800.0" y="496.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14532d" text-anchor="middle">Plain HTTP,</text><text x="800.0" y="527.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14532d" text-anchor="middle">auto-reconnect</text><text x="800.0" y="557.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#14532d" text-anchor="middle">Text only, one way</text><rect x="1080" y="230" width="440" height="420" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1300.0" y="344.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#4c1d95" text-anchor="middle">WebSocket</text><text x="1300.0" y="375.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#4c1d95" text-anchor="middle">Both sides talk often:</text><text x="1300.0" y="405.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#4c1d95" text-anchor="middle">chat, multiplayer,</text><text x="1300.0" y="436.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#4c1d95" text-anchor="middle">collaborative editing</text><text x="1300.0" y="466.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#4c1d95" text-anchor="middle"></text><text x="1300.0" y="496.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#4c1d95" text-anchor="middle">Low latency,</text><text x="1300.0" y="527.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#4c1d95" text-anchor="middle">two-way, binary</text><text x="1300.0" y="557.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#4c1d95" text-anchor="middle">Stateful to scale</text><text x="80" y="730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#475569" text-anchor="start">Rule of thumb: if the client only listens, use SSE. If it talks back often, use WebSockets.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>