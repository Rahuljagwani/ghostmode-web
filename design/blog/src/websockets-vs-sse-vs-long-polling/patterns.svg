<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Three ways to push updates to the browser</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">What travels over the network, from left to right in time</text><text x="80" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f" text-anchor="start">Long polling</text><line x1="330" y1="250" x2="1520" y2="250" stroke="#cbd5e1" stroke-width="3"/><line x1="360" y1="250" x2="400" y2="300" stroke="#d97706" stroke-width="3.5" marker-end="url(#head)"/><rect x="400" y="290" width="220" height="20" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><line x1="620" y1="300" x2="660" y2="250" stroke="#d97706" stroke-width="3.5" marker-end="url(#head)"/><line x1="700" y1="250" x2="740" y2="300" stroke="#d97706" stroke-width="3.5" marker-end="url(#head)"/><rect x="740" y="290" width="220" height="20" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><line x1="960" y1="300" x2="1000" y2="250" stroke="#d97706" stroke-width="3.5" marker-end="url(#head)"/><line x1="1040" y1="250" x2="1080" y2="300" stroke="#d97706" stroke-width="3.5" marker-end="url(#head)"/><rect x="1080" y="290" width="220" height="20" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><line x1="1300" y1="300" x2="1340" y2="250" stroke="#d97706" stroke-width="3.5" marker-end="url(#head)"/><text x="360" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">request waits on the server until there&#x27;s news (or a timeout), then the client asks again</text><text x="80" y="478" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d" text-anchor="start">SSE</text><line x1="330" y1="470" x2="1520" y2="470" stroke="#cbd5e1" stroke-width="3"/><line x1="360" y1="470" x2="400" y2="520" stroke="#16a34a" stroke-width="3.5" marker-end="url(#head)"/><rect x="400" y="510" width="1100" height="20" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><line x1="560" y1="510" x2="560" y2="478" stroke="#16a34a" stroke-width="3.5" marker-end="url(#head)"/><line x1="820" y1="510" x2="820" y2="478" stroke="#16a34a" stroke-width="3.5" marker-end="url(#head)"/><line x1="1080" y1="510" x2="1080" y2="478" stroke="#16a34a" stroke-width="3.5" marker-end="url(#head)"/><line x1="1340" y1="510" x2="1340" y2="478" stroke="#16a34a" stroke-width="3.5" marker-end="url(#head)"/><text x="360" y="570" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">one long HTTP response; the server sends events down it whenever it wants (one direction)</text><text x="80" y="698" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#4c1d95" text-anchor="start">WebSocket</text><line x1="330" y1="690" x2="1520" y2="690" stroke="#cbd5e1" stroke-width="3"/><line x1="360" y1="690" x2="400" y2="740" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#head)"/><rect x="400" y="730" width="1100" height="20" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><line x1="560" y1="730" x2="560" y2="698" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#head)"/><line x1="1080" y1="730" x2="1080" y2="698" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#head)"/><line x1="820" y1="698" x2="820" y2="728" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#head)"/><line x1="1340" y1="698" x2="1340" y2="728" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#head)"/><text x="360" y="790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">HTTP upgrade (101), then one TCP connection; both sides send messages at any time</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>