<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Vector index types at a glance</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">There&#x27;s no best index, only the right trade-off for your data size and latency</text><rect x="80" y="200" width="220" height="120" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="190.0" y="272.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a" text-anchor="middle">Flat</text><text x="340" y="255" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">exact search, scans every vector</text><text x="340" y="295" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Use for: small data, or ground truth for tests</text><rect x="80" y="350" width="220" height="120" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="190.0" y="422.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#0c4a6e" text-anchor="middle">IVF</text><text x="340" y="405" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">clusters vectors, searches the nearest few</text><text x="340" y="445" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Use for: large data, fast builds, tune nprobe</text><rect x="80" y="500" width="220" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="190.0" y="572.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#4c1d95" text-anchor="middle">HNSW</text><text x="340" y="555" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">layered graph, greedy walk to neighbours</text><text x="340" y="595" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Use for: low latency, high recall, more memory</text><rect x="80" y="650" width="220" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="190.0" y="722.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#78350f" text-anchor="middle">PQ</text><text x="340" y="705" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">compresses vectors into short codes</text><text x="340" y="745" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Use for: huge data that must fit in memory</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>