<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">How a vector search query runs</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Approximate search gives speed; filters and re-ranking give accuracy</text><rect x="70" y="330" width="300" height="180" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="220.0" y="415.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0c4a6e" text-anchor="middle">Embed</text><text x="220.0" y="448.05" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0c4a6e" text-anchor="middle">query -&gt; vector</text><line x1="372" y1="420" x2="446" y2="420" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="450" y="330" width="300" height="180" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="600.0" y="399.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#4c1d95" text-anchor="middle">ANN index</text><text x="600.0" y="431.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4c1d95" text-anchor="middle">HNSW / IVF</text><text x="600.0" y="464.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#4c1d95" text-anchor="middle">top 100</text><line x1="752" y1="420" x2="826" y2="420" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="830" y="330" width="300" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="980.0" y="399.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#78350f" text-anchor="middle">Filter</text><text x="980.0" y="431.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#78350f" text-anchor="middle">tenant, date,</text><text x="980.0" y="464.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#78350f" text-anchor="middle">permissions</text><line x1="1132" y1="420" x2="1206" y2="420" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1210" y="330" width="300" height="180" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1360.0" y="399.59999999999997" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#14532d" text-anchor="middle">Re-rank</text><text x="1360.0" y="431.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">cross-encoder</text><text x="1360.0" y="464.19999999999993" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#14532d" text-anchor="middle">top 5</text><text x="70" y="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#475569" text-anchor="start">Approximate nearest neighbour (ANN) search trades a little recall for big speed.</text><text x="70" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Filtering after the search can leave too few results; filter during the search if the store supports it.</text><text x="70" y="735" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Measure recall@k against exact (brute-force) search on a sample of real queries.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>