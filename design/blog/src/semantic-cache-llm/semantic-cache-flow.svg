<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Semantic cache for an LLM app</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Similar questions reuse a stored answer instead of calling the model again</text><rect x="60" y="340" width="260" height="150" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="190.0" y="399.40000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="middle">Question</text><text x="190.0" y="424.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0c4a6e" text-anchor="middle">&quot;How do I reset</text><text x="190.0" y="448.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0c4a6e" text-anchor="middle">my password?&quot;</text><rect x="410" y="340" width="250" height="150" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="535.0" y="399.40000000000003" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#4c1d95" text-anchor="middle">Embed</text><text x="535.0" y="424.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4c1d95" text-anchor="middle">question becomes</text><text x="535.0" y="448.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4c1d95" text-anchor="middle">a vector</text><rect x="750" y="320" width="320" height="190" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="910.0" y="398.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#78350f" text-anchor="middle">Vector search</text><text x="910.0" y="424.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78350f" text-anchor="middle">nearest stored</text><text x="910.0" y="451.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78350f" text-anchor="middle">question in cache</text><rect x="1200" y="170" width="330" height="160" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1365.0" y="234.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d" text-anchor="middle">Hit: return</text><text x="1365.0" y="259.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#14532d" text-anchor="middle">cached answer,</text><text x="1365.0" y="283.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#14532d" text-anchor="middle">no model call</text><rect x="1200" y="520" width="330" height="160" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="1365.0" y="584.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Miss: call LLM</text><text x="1365.0" y="609.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle">then store question,</text><text x="1365.0" y="633.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0f172a" text-anchor="middle">vector and answer</text><line x1="320" y1="415" x2="406" y2="415" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="660" y1="415" x2="746" y2="415" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><line x1="1072" y1="360" x2="1196" y2="260" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1019.2" y="272.0" width="229.60000000000002" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1134.0" y="298.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">similarity &gt;= 0.92</text><line x1="1072" y1="470" x2="1196" y2="590" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1036.0" y="536.0" width="196.00000000000003" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1134.0" y="562.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">below threshold</text><path d="M 1365 684 C 1365 790, 910 790, 910 514" fill="none" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="1098.0" y="728" width="84.0" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1140" y="754.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">store</text><text x="80" y="820" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Scope the cache per user or tenant, and expire entries when the source data changes.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>