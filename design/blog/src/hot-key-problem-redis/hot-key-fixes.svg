<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Two ways to spread a hot key</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">A local copy absorbs most reads; key copies spread the rest across shards</text><rect x="80" y="300" width="300" height="200" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="230.0" y="382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#14532d" text-anchor="middle">App server</text><text x="230.0" y="410.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14532d" text-anchor="middle">in-memory copy</text><text x="230.0" y="439.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#14532d" text-anchor="middle">TTL 1-2 s</text><line x1="382" y1="400" x2="560" y2="400" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="406.6" y="358.0" width="128.8" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="471.0" y="384.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">miss only</text><rect x="565" y="230" width="420" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="775.0" y="289.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="middle">post:42:1 on shard A</text><rect x="565" y="350" width="420" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="775.0" y="409.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="middle">post:42:2 on shard B</text><rect x="565" y="470" width="420" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="775.0" y="529.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0c4a6e" text-anchor="middle">post:42:3 on shard C</text><text x="1040" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="start">Read a random copy.</text><text x="1040" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Write or delete all copies</text><text x="1040" y="376" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">when the value changes.</text><text x="1040" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="start">On expiry, one request</text><text x="1040" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="start">rebuilds; the rest wait.</text><text x="80" y="790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="start">Most reads stop at the app server. The few that reach Redis are spread over several shards.</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>