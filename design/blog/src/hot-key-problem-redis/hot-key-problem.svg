<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">The hot key problem</text><text x="80" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#64748b">Every read of one key lands on the same shard, however many nodes you add</text><rect x="80" y="330" width="300" height="170" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="230.0" y="397.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0c4a6e" text-anchor="middle">App servers</text><text x="230.0" y="425.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0c4a6e" text-anchor="middle">millions of reads</text><text x="230.0" y="454.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#0c4a6e" text-anchor="middle">of post:42</text><rect x="620" y="230" width="360" height="130" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="800.0" y="277.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#7f1d1d" text-anchor="middle">Shard A</text><text x="800.0" y="305.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#7f1d1d" text-anchor="middle">post:42 lives here</text><text x="800.0" y="334.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#7f1d1d" text-anchor="middle">100% CPU</text><rect x="620" y="400" width="360" height="110" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="800.0" y="451.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Shard B</text><text x="800.0" y="478.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">idle</text><rect x="620" y="550" width="360" height="110" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/><text x="800.0" y="601.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">Shard C (new)</text><text x="800.0" y="628.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0f172a" text-anchor="middle">idle</text><line x1="382" y1="400" x2="616" y2="300" stroke="#475569" stroke-width="3.5" marker-end="url(#head)"/><rect x="423.4" y="310.0" width="151.20000000000002" height="32.0" rx="16.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="499.0" y="336.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">all traffic</text><text x="1040" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="start">A key maps to one hash slot,</text><text x="1040" y="336" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#475569" text-anchor="start">and one slot to one shard.</text><text x="1040" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">Adding shards spreads keys,</text><text x="1040" y="436" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#475569" text-anchor="start">not the traffic of one key.</text><text x="80" y="790" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="start">Redis Cluster: 16,384 hash slots, each served by one master (replicas can serve reads).</text><text x="1540" y="864" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-anchor="end">renekin.com</text></svg>